<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Cómo soy yo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="respuesta.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>

  <!-- pétalos cayendo de fondo, se generan desde respuesta.js -->
  <div class="petals-fall" id="petalsFall" aria-hidden="true"></div>

  <!-- ===================== HERO / PREGUNTA ===================== -->
  <header class="hero">
    <p class="hero__date">21 de septiembre &mdash; el día de la flor amarilla</p>
    <h1 class="hero__question">&ldquo;¿Cómo soy yo?&rdquo;</h1>
    <p class="hero__asked-by">&mdash; lo preguntaste tú, <span data-slot="nombre">Mona</span></p>

    <div class="bouquet" id="bouquet">
      <!-- las flores se generan dinámicamente desde CONFIG.palabras en respuesta.js -->
    </div>

    <p class="hero__hint" id="bouquetHint">Recoge cada flor para descubrir la respuesta</p>
  </header>

  <!-- ===================== PALABRA REVELADA ===================== -->
  <section class="reveal">
    <div class="reveal__card">
      <p class="reveal__word" id="revealWord">&nbsp;</p>
    </div>
  </section>

  <!-- ===================== MENSAJE FINAL + PERRITA ===================== -->
  <section class="final" id="finalSection" hidden>
    <div class="photo-row">
      <figure class="photo-frame photo-frame--dog">
        <div class="photo-frame__inner">
          <img class="photo-frame__img" src="Copito.jpeg" alt="Foto de su shih tzu">
          <div class="photo-frame__placeholder">
            <svg viewBox="0 0 40 40" class="photo-frame__icon" aria-hidden="true">
              <ellipse cx="20" cy="26" rx="9" ry="7"/>
              <ellipse cx="10" cy="14" rx="4" ry="5"/>
              <ellipse cx="19" cy="9"  rx="4" ry="5"/>
              <ellipse cx="30" cy="14" rx="4" ry="5"/>
            </svg>
            <span>Sube aquí la foto de <span data-slot="perrita">tu shih tzu</span></span>
          </div>
        </div>
        <figcaption>Hasta <span data-slot="perrita">Zeus</span> está de acuerdo.</figcaption>
      </figure>

      <figure class="photo-frame photo-frame--ramo">
        <div class="photo-frame__inner">
          <img class="photo-frame__img" src="Ramo.jpeg" alt="Foto del ramo de flores amarillas">
          <div class="photo-frame__placeholder">
            <svg viewBox="0 0 40 40" class="photo-frame__icon" aria-hidden="true">
              <circle cx="20" cy="20" r="6"/>
              <circle cx="20" cy="8"  r="6"/>
              <circle cx="20" cy="32" r="6"/>
              <circle cx="8"  cy="20" r="6"/>
              <circle cx="32" cy="20" r="6"/>
            </svg>
            <span>Sube aquí la foto del ramo</span>
          </div>
        </div>
        <figcaption>Ten tu ramito</figcaption>
      </figure>
    </div>

    <p class="final__message" id="finalMessage"></p>
  </section>
  <script src="respuesta.js"></script>
  <script src="menu.js"></script>
</body>
</html>
